<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Mayara Gussonato">
    <meta name="description" content="Site da empresa DevConnect">

    <title>Feed - Devconncet</title>

    <link rel="shortcut icon" href="../images/DevCon-meu.svg" type="image/x-icon">

    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/feed.css">
</head>

<body>
    <h1> Tela Feed - Devcoonect </h1>

    <header id="cabecalho">
        <nav>
            <a id="logo-desktop" href="./feed.html">
                <img src="../images/DevConnect-MEU p2.svg" alt="logo da empresa Devconncet">
            </a>
            <a id="logo-mobile" href="./feed.html">
                <img src="../images/DevCon-meu.svg" alt="logo da empresa Devconncet">
            </a>

            <div class="cabecalho-acoes">
                <a href="./feed.html">
                    <img id="icones-perfil" src="../images/casa-branca.svg" alt="">
                </a>
                <a href="./feed.html">
                    <img id="icones-perfil" src="../images/coracao-branco.svg" alt="">
                </a>
                <!-- Foto de perfil com link para a página de perfil -->
                <a href="./perfil.html">
                    <img class="foto-perfil" src="../images/perfil 1.svg" alt="foto de perfil">
                </a>
            </div>
        </nav>
    </header>

    <main>
        <div class="container-flex-publi">
            <section id="storys" class="estilo-formulario">
                <article class="card-story">
                    <a href="#">
                        <img src="../images/perfil 1.svg" alt="">
                        <span>Seu story</span>
                    </a>
                </article>
                <article class="card-story">
                    <a href="#">
                        <img src="../images/justin.jpg" alt="">
                        <span class="nome-com-verificado">
                            lilbiebe
                            <img class="vericado" src="../images/verificacao.svg" alt="">
                        </span>
                    </a>
                </article>
                <article class="card-story">
                    <a href="#">
                        <img src="../images/kyan.png" alt="">
                        <span class="nome-com-verificado">
                            Kyanmaloka
                            <img class="vericado" src="../images/verificacao.svg" alt="">
                        </span>
                    </a>
                </article>
                <article class="card-story">
                    <a href="#">
                        <img src="../images/348964640_1529990624205952_2756565750513091611_n.jpg" alt="">
                        <span class="nome-com-verificado">
                            prod.toledo
                            <img class="vericado" src="../images/verificacao.svg" alt="">
                        </span>
                    </a>
                </article>
                <article class="card-story">
                    <a href="#">
                        <img src="../images/l7.jpg" alt="">
                        <span class="nome-com-verificado">
                            L7nnon
                            <img class="vericado" src="../images/verificacao.svg" alt="">
                        </span>
                    </a>
                </article>
                <article class="card-story">
                    <a href="#">
                        <img src="../images/spnv 2.jpg" alt="">
                        <span class="nome-com-verificado">
                            Spnv.ent
                            <img class="vericado" src="../images/verificacao.svg" alt="">
                        </span>
                    </a>
                </article>
                <article class="card-story">
                    <a href="#">
                        <img src="../images/shanshan.png" alt="">
                        <span class="nome-com-verificado">
                            Shandinnn
                            <img class="vericado" src="../images/verificacao.svg" alt="">
                        </span>
                    </a>
                </article>
                <article class="card-story">
                    <a href="#">
                        <img src="../images/Niink story.png" alt="">
                        <span class="nome-com-verificado">
                            Niink
                            <img class="vericado" src="../images/verificacao.svg" alt="">
                        </span>
                    </a>
                </article>
                <article class="card-story">
                    <a href="#">
                        <img src="../images/koda.jpg" alt="">
                        <span class="nome-com-verificado">
                            koda.dj
                            <img class="vericado" src="../images/verificacao.svg" alt="">
                        </span>
                    </a>
                </article>
                <article class="card-story">
                    <a href="#">
                        <img src="../images/perfil-ghard.jpg" alt="">
                        <span class="nome-com-verificado">
                            g.hard1
                            <img class="vericado" src="../images/verificacao.svg" alt="">
                        </span>
                    </a>
                </article>
            </section>
            <!--fim de story-->

            <section id="cadastro-publi" class="estilo-formulario">
                <h2>Publicação</h2>

                <form action="">
                    <textarea placeholder="Digite a descrição do post..."></textarea>

                    <footer class="botoes-form">
                        <label for="campo-upload" class="botao-upload">
                            Faça o upload
                        </label>
                        <input type="file" id="campo-upload" style="display:none;">

                        <button type="submit" class="formulario-botao-azul">
                            Postar
                        </button>
                    </footer>
                </form>
            </section>

            <section id="publicacoes">
                <!--inicio card publi-->
                <article class="card-publi">
                    <header>
                        <a href="#">
                            <img class="foto-perfil" src="../images/perfil-ghard.jpg" alt="">
                            <span class="nome-com-verificado">
                                g.hard1
                                <img class="vericado" src="../images/verificacao.svg" alt="">
                            </span>
                        </a>
                    </header>

                    <figure>
                        <img class="imagem-publicacao" src="../images/publicacao-ghard.png" alt="">

                        <figcaption class="descricao-publicacao">
                            g.hard1
                            <p>Treinado na queda, pronto pra levantar de novo, de novo e de novo.</p>
                        </figcaption>
                        <div class="interacoes-publi">
                            <button>
                                <img class="icone-interacao" src="../images/icone-coracao-preto.svg" alt="curtidas">
                                326 mil
                            </button>
    
                            <button>
                                <img class="icone-interacao" src="../images/icone-comentario-preto.svg" alt="comentarios">
                                3.644
                            </button>
                        </div>
                    </figure>

                    <button type="button">Ver mais comentários...</button>
                </article>
                <!--fim card publi-->
            </section>
        </div>
    </main>
    <!--fim da main-->
</body>

</html>
