<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Mayara Gussonato">
    <meta name="description" content="Site da empresa DevConnect">

    <title>Cadastro - DevConnect</title>

    <link rel="shortcut icon" href="../images/DevCon-meu.svg" 
    type="image/x-icon">
    
    <!--css-->
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/cadastro.css">
    <link rel="stylesheet" href="../styles/login.css">

    
</head>

<body>
    <h1> Tela de cadastro</h1>
    <main>
        <div>
            <!--FORMULARIO-->
            <form id="formulario" class="estilo-formulario">
                <img src="../images/DevConnect-MEU p2.svg" alt="Logo DevConnect">
                
            <div></div>
            <p> Cadastrar-se para comunidade 
                exclusiva de desenvolvedores(as)</p>

            <input type="text" placeholder=" Nome e sobrenome">
            <input type="text" placeholder=" Nome de usuário">
            <input type="email" placeholder=" E-mail">
            <input type="password" placeholder=" Senha ">

            <div>
                <label for="campo-upload" class="botao-upload">
                    Faça upload da sua imagem aqui...
                </label>
            
                <!-- O input fica escondido -->
                <input type="file" id="campo-upload" style="display:none;">
            </div>
            
            <button type="submit" class="formulario-botao-azul">Cadastrar-se</button>

            <p>Ao se cadastrar, você concorda com nossos 
                Termos, Política de Dados e Política de cookies.</p>

        </form>
        <div class="login.css">
            <p>Tem uma conta? <a href="../pages/index.html">Conecte-se</a></p>
        </div>
    </div>
</body>
</html>
